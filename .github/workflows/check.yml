name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test key filtering rules
        run: .\tests\Test-KeyFilter.ps1
      - name: Verify distributable BAT scripts
        run: .\tools\Test-Distribution.ps1
